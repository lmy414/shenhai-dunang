<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2b4f">
<title>深海的嘟囔 · 角色活动求索</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" data-view="gacha">
  <img class="scene-bg" src="assets/bg_clean.png" alt="">
  <!-- 原图切片负责视觉，DOM 负责排布、动态文字与交互。 -->
  <header class="game-header">
    <button class="brand" data-act="navigate" data-view="gacha" aria-label="返回求索"><img src="assets/app.png" alt=""><span>深海的嘟囔</span></button>
    <div class="resources">
      <button class="reset-chip" data-act="reset-collection" title="重置抽卡记录和仓库" aria-label="重置抽卡记录和仓库"><span aria-hidden="true">↺</span>重置</button>
      <button class="resource" data-act="shop-rice" aria-label="米饭，打开食堂"><img src="assets/ui/resource-rice.png" alt=""><span id="riceNum">0</span></button>
      <button class="resource" data-act="shop-whale" aria-label="鲸币，打开兑换"><img src="assets/ui/resource-whale.png" alt=""><span id="whaleNum">0</span></button>
      <button class="icon-button" data-act="navigate" data-view="gacha" aria-label="返回求索"><img src="assets/ui/close.png" alt=""></button>
    </div>
  </header>
  <main>
    <section class="game-view gacha-view" id="gachaView" aria-label="角色与武器活动求索">
      <h1 class="sr-only">角色活动求索</h1>
  <img class="gacha-original-bg" src="assets/bg.jpg" alt="">

  <div class="weapon-scene" aria-hidden="true">
    <img class="weapon-plate weapon-fallback" src="assets/bg_weapon.jpg" alt="">
    <img class="weapon-plate weapon-composite" alt="">
    <div hidden>
      <img data-layer data-x="0" data-y="0" src="assets/ui/weapon/background.png" alt="">
      <img data-layer data-x="288" data-y="152" src="assets/ui/weapon/title.png" alt="">
      <img data-layer data-x="312" data-y="460" src="assets/ui/weapon/rules.png" alt="">
      <img data-layer data-x="20" data-y="135" src="assets/ui/weapon/activity-character.png" alt="">
      <img data-layer data-x="24" data-y="334" src="assets/ui/weapon/activity-rice.png" alt="">
      <img data-layer data-x="24" data-y="515" src="assets/ui/weapon/activity-whale.png" alt="">
      <img data-layer data-x="24" data-y="694" src="assets/ui/weapon/activity-weapon.png" alt="">
      <img data-layer data-x="1376" data-y="4" src="assets/ui/weapon/resource-rice.png" alt="">
      <img data-layer data-x="1680" data-y="4" src="assets/ui/weapon/resource-whale.png" alt="">
      <img data-layer data-x="1940" data-y="4" src="assets/ui/weapon/close.png" alt="">
      <img data-layer data-x="1568" data-y="352" src="assets/ui/weapon/badge.png" alt="">
      <img data-layer data-x="44" data-y="940" src="assets/ui/weapon/shortcut-shop.png" alt="">
      <img data-layer data-x="192" data-y="940" src="assets/ui/weapon/shortcut-details.png" alt="">
      <img data-layer data-x="336" data-y="940" src="assets/ui/weapon/shortcut-history.png" alt="">
      <img data-layer data-x="1204" data-y="932" src="assets/ui/weapon/pull-one.png" alt="">
      <img data-layer data-x="1608" data-y="932" src="assets/ui/weapon/pull-ten.png" alt="">
    </div>
  </div>
  <!-- 角色池：当期 UP 立绘 + 其余 5★ 泡泡 + 金光粒子；内容由 app.js 的 UP_SHOWCASE 生成 -->
  <div class="U char-showcase" id="charShowcase" style="--x:880;--y:96;--w:700;--h:800" aria-label="当期 UP 角色">
    <canvas class="cs-fx"></canvas>
    <button class="cs-up" data-act="preview" title="查看 UP 角色" aria-label="查看 UP 角色"><img alt=""></button>
    <div class="cs-bubbles"></div>
  </div>
  <button class="U showcase" data-act="preview" title="查看 UP 武器" aria-label="查看 UP 武器" style="--x:1010;--y:110;--w:470;--h:760"><img src="assets/weapons/whalefall.png" alt="鲸落"></button>

  <!-- 顶栏货币：遮住底图上的数字，显示实时余额 -->
  <div class="U cur" id="gachaRiceNum" style="--x:1454;--y:28;--w:126;--h:44">0</div>
  <div class="U cur" id="gachaWhaleNum" style="--x:1724;--y:28;--w:110;--h:44">0</div>

  <!-- 可点区域（坐标对应底图 2000×1125） -->
  <!-- 重置抽卡记录和仓库：放在米饭栏左边 -->
  <button class="U reset-chip" data-act="reset-collection" title="重置抽卡记录和仓库" aria-label="重置抽卡记录和仓库" style="--x:1244;--y:24;--w:126;--h:50"><span aria-hidden="true">↺</span>重置</button>
  <button class="U hot" data-act="shop-rice" title="米饭" aria-label="米饭" style="--x:1380;--y:20;--w:200;--h:58;--r:29"></button>
  <button class="U hot round" data-act="shop-rice" title="充值米饭" aria-label="充值米饭" style="--x:1583;--y:24;--w:50;--h:50"></button>
  <button class="U hot" data-act="shop-whale" title="鲸币" aria-label="鲸币" style="--x:1650;--y:20;--w:185;--h:58;--r:29"></button>
  <button class="U hot round" data-act="shop-whale" title="兑换鲸币" aria-label="兑换鲸币" style="--x:1836;--y:24;--w:50;--h:50"></button>
  <button class="U hot round" data-act="settings" title="设置" aria-label="设置" style="--x:1903;--y:13;--w:74;--h:74"></button>

  <button class="U hot" data-act="tab" data-tab="0" title="角色活动求索" aria-label="角色活动求索" style="--x:26;--y:138;--w:248;--h:182"></button>
  <button class="U hot" data-act="tab" data-tab="1" title="饭点活动求索" aria-label="饭点活动求索" style="--x:30;--y:330;--w:236;--h:166"></button>
  <button class="U hot" data-act="tab" data-tab="2" title="摸鱼活动求索" aria-label="摸鱼活动求索" style="--x:30;--y:506;--w:236;--h:164"></button>
  <button class="U hot" data-act="tab" data-tab="3" title="武器活动求索" aria-label="武器活动求索" style="--x:30;--y:682;--w:236;--h:162"></button>

  <button class="U hot" data-act="details" title="卡池详情" aria-label="卡池详情" style="--x:300;--y:180;--w:580;--h:260"></button>
  <button class="U hot" data-act="preview" title="查看 UP 角色" aria-label="查看 UP 角色" style="--x:1546;--y:362;--w:426;--h:152;--r:76"></button>
  <button class="U hot round" data-act="preview" title="角色预览" aria-label="角色预览" style="--x:1860;--y:515;--w:96;--h:96"></button>

  <button class="U hot" data-act="shop-rice" title="食堂兑换" aria-label="食堂兑换" style="--x:50;--y:928;--w:124;--h:168"></button>
  <button class="U hot" data-act="details" title="深度思考" aria-label="深度思考" style="--x:194;--y:928;--w:126;--h:168"></button>
  <button class="U hot" data-act="history" title="摸鱼记录" aria-label="摸鱼记录" style="--x:338;--y:928;--w:126;--h:168"></button>

  <button class="U hot hex" data-act="pull" data-n="1" title="求索1次" aria-label="求索1次" style="--x:1186;--y:916;--w:382;--h:128"></button>
  <button class="U hot hex ten" data-act="pull" data-n="10" title="求索10次" aria-label="求索10次" style="--x:1575;--y:916;--w:384;--h:128"></button>

  <!-- 仓库入口沿用现有图标，和原图的底部入口排在同一行。 -->
  <button class="U warehouse-entry" data-act="navigate" data-view="characters" aria-label="角色仓库" style="--x:482;--y:928;--w:124;--h:168"><img src="assets/app.png" alt=""><span>角色仓库</span></button>
  <button class="U warehouse-entry" data-act="navigate" data-view="weapons" aria-label="武器仓库" style="--x:626;--y:928;--w:124;--h:168"><img src="assets/icons/spoon.png" alt=""><span>武器仓库</span></button>

  <div class="U credit" style="--x:806;--y:1010;--w:350;--h:100">
    <div class="lbl">制作者</div>
    <div>B站：镜花_Mirror</div>
    <div>B站：彼岸花Channel</div>
  </div>

  <div class="U pity" id="pity" style="--x:1186;--y:1050;--w:772;--h:40"></div>

  <div class="U gacha-pity-number pity-character" style="--x:411.1328125;--y:544.921875;--w:64.453125;--h:44.921875">90</div>
  <div class="U gacha-pity-number pity-weapon" style="--x:406.25;--y:546.875;--w:67.3828;--h:43.9453">90</div>
    </section>
    <!-- 饭点活动：深海捞饭。画面在 fishCanvas 上绘制，DOM 只负责界面文字和按钮；坐标同样是 2000×1125 -->
    <section class="game-view fishing-view" id="fishingView" aria-label="饭点活动 · 深海捞饭" hidden>
      <img class="fish-scene" alt=""><img class="fish-scene" alt="">
      <canvas id="fishCanvas" aria-label="点击水中撒网"></canvas>
      <div class="U fish-title" style="--x:28;--y:20;--w:560;--h:88"><b>饭点活动 · 深海捞饭</b><span id="fishSceneName"></span></div>
      <div class="U fish-weather" id="fishWeather" style="--x:28;--y:118;--w:720;--h:58"></div>
      <div class="U fish-clock" style="--x:640;--y:20;--w:720;--h:88"><span id="fishTimer">00:00</span><small id="fishStats"></small></div>
      <div class="U fish-rice" style="--x:1400;--y:28;--w:330;--h:66"><img src="assets/icons/rice.png" alt=""><span id="fishRiceNum">0</span><button data-act="shop-rice" title="补充米饭" aria-label="补充米饭">＋</button></div>
      <button class="U fish-round" data-act="fish-info" title="玩法说明" aria-label="玩法说明" style="--x:1752;--y:24;--w:76;--h:76"><img src="assets/icons/bulb.png" alt=""></button>
      <button class="U fish-round" data-act="fish-settle" title="结算并离开" aria-label="结算并离开" style="--x:1852;--y:24;--w:76;--h:76"><img src="assets/ui/close.png" alt=""></button>
      <div class="U fish-feed" id="fishFeed" style="--x:1560;--y:130;--w:420;--h:520" aria-live="polite"></div>
      <button class="U fish-gear" data-act="fish-gear" title="装备栏" aria-label="装备栏" style="--x:30;--y:850;--w:250;--h:230"><img class="slot" src="assets/fishing/gear-slot.png" alt=""><img class="weapon" id="fishGearImg" alt=""><span id="fishGearEmpty">＋ 装备武器</span></button>
      <div class="U fish-perks" id="fishPerks" style="--x:296;--y:880;--w:520;--h:200"></div>
      <button class="U fish-btn" data-act="fish-pause" id="fishPauseBtn" title="暂停" aria-label="暂停" style="--x:1640;--y:930;--w:150;--h:166"><img src="assets/fishing/btn-pause.png" alt=""><span>暂停</span></button>
      <button class="U fish-btn" data-act="fish-settle" title="结算" aria-label="结算" style="--x:1808;--y:930;--w:150;--h:166"><img src="assets/fishing/btn-settle.png" alt=""><span>结算</span></button>
      <button class="fish-paused" data-act="fish-pause" aria-label="继续捕鱼"><img src="assets/fishing/btn-resume.png" alt=""><b>已暂停</b><span>点击继续捕鱼</span></button>
    </section>
    <section class="game-view inventory-view" id="charactersView" aria-label="角色仓库" hidden>
      <div class="view-heading original-capsule"><h1>角色仓库 <small class="collection-total"></small></h1></div>
      <div class="inventory-toolbar"><div class="inventory-tabs" aria-label="持有状态"><button class="active" data-act="inventory-mode" data-mode="owned" aria-pressed="true">已获得</button><button data-act="inventory-mode" data-mode="all" aria-pressed="false">全部角色</button></div><label>星级 <select class="inventory-rarity" aria-label="星级"><option value="0">全部星级</option><option value="5">5 星</option><option value="4">4 星</option><option value="3">3 星</option></select></label></div>
      <div class="inventory-grid"  aria-live="polite"></div>
    </section>
    <section class="game-view inventory-view" id="weaponsView" aria-label="武器仓库" hidden>
      <div class="view-heading original-capsule"><h1>武器仓库 <small class="collection-total"></small></h1></div>
      <div class="inventory-toolbar"><div class="inventory-tabs" aria-label="持有状态"><button class="active" data-act="inventory-mode" data-mode="owned" aria-pressed="true">已获得</button><button data-act="inventory-mode" data-mode="all" aria-pressed="false">全部武器</button></div><label>星级 <select class="inventory-rarity" aria-label="星级"><option value="0">全部星级</option><option value="5">5 星</option><option value="4">4 星</option><option value="3">3 星</option></select></label></div>
      <div class="inventory-grid"  aria-live="polite"></div>
    </section>
  </main>
  <footer class="game-footer">
    <nav class="main-nav" aria-label="主导航"><button data-act="navigate" data-view="gacha"><img src="assets/icons/tail.png" alt=""><span>返回求索</span></button><button data-act="navigate" data-view="characters"><img src="assets/app.png" alt=""><span>角色仓库</span></button><button data-act="navigate" data-view="weapons"><img src="assets/icons/spoon.png" alt=""><span>武器仓库</span></button><button data-act="shop-rice"><img src="assets/icons/bowl.png" alt=""><span>食堂兑换</span></button></nav>
    <span class="creator-credit">制作者<br>B站：镜花_Mirror<br>B站：彼岸花Channel</span>
    <div class="footer-tools"><button data-act="settings"><img src="assets/icons/bulb.png" alt=""><span>设置</span></button><button data-act="history"><img src="assets/icons/clock.png" alt=""><span>求索记录</span></button></div>
  </footer>

  <!-- 抽卡演出层 -->
  <div id="fx">
    <canvas id="fxCanvas"></canvas>
    <div id="reveal">
      <div class="bgtext"><span></span><span></span></div>
      <div class="rays"></div>
      <div class="halo"></div>
      <div class="ground"></div>
      <div class="shock"></div>
      <img class="char" alt="">
      <div class="sweep"></div>
      <div class="count"></div>
      <div class="new">NEW</div>
      <div class="info">
        <div class="stars"></div>
        <div class="nm"></div>
        <div class="sub"></div>
        <div class="quote"></div>
      </div>
      <div class="tip">点击屏幕继续</div>
      <div class="wipe"></div>
    </div>
    <div id="summary">
      <div class="ttl">求 索 结 果</div>
      <div class="cards"></div>
      <div class="row">
        <button class="btn" data-act="again">再来十次</button>
        <button class="btn dark" data-act="fx-close">确认</button>
      </div>
    </div>
    <div id="flash"></div>
    <button id="skip">跳过 ▸▸</button>
  </div>

  <!-- 弹窗 -->
  <div class="mask" id="mask">
    <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <button class="x" data-act="modal-close" aria-label="关闭弹窗">✕</button>
      <h2 id="panelTitle"></h2>
      <div class="body" id="panelBody"></div>
    </div>
  </div>

  <div id="toast" role="status"></div>
</div>
<script src="app.js"></script>
</body>
</html>
