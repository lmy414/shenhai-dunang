name: Deploy to Cloudflare Pages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      PROJECT: shenhai-dunang
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JS syntax
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v '^\.github/'); do
            echo "node --check $f"; node --check "$f"
          done

      - name: Check entry files and asset references
        run: |
          set -e
          for f in index.html app.js style.css; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          missing=0
          for ref in $(grep -ohE "assets/[A-Za-z0-9_./-]+\.(png|jpe?g|gif|webp|svg|mp3|ogg|wav)" index.html app.js style.css | sort -u); do
            [ -f "$ref" ] || { echo "::error::missing asset $ref"; missing=1; }
          done
          # 角色立绘通过 charSrc(id) 拼路径，按 CHARS 里的 id 逐个检查
          for id in $(grep -oE "id: *'[a-z0-9_-]+'" app.js | sed -E "s/.*'(.*)'/\1/" | sort -u); do
            [ -f "assets/chars/$id.png" ] || { echo "::error::missing assets/chars/$id.png"; missing=1; }
          done
          exit $missing

      - name: Build dist/
        run: |
          set -e
          rm -rf dist && mkdir dist
          cp index.html app.js style.css dist/
          cp -r assets dist/
          find dist -type f | wc -l

      - name: Deploy to Cloudflare Pages (production)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          npx -y wrangler@3 pages deploy dist \
            --project-name "$PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$TAG" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        run: |
          set -e
          for u in "${{ steps.deploy.outputs.url }}" "https://$PROJECT.pages.dev"; do
            [ -n "$u" ] || continue
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$u/") || true
              js=$(curl -s -o /dev/null -w '%{http_code}' "$u/app.js") || true
              echo "$u -> index $code, app.js $js"
              if [ "$code" = 200 ] && [ "$js" = 200 ]; then ok=1; break; fi
              sleep 10
            done
            [ $ok = 1 ] || { echo "::error::$u not reachable"; exit 1; }
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## 深海的嘟囔 部署"
            echo "- 版本：\`$TAG\`"
            echo "- Commit：[\`${GITHUB_SHA::7}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "- 本次部署：${{ steps.deploy.outputs.url || '（未生成）' }}"
            echo "- 生产地址：https://$PROJECT.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
